<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Debate Referee · Stage</title>
<!-- Two-sided "stage" view: each fact check pops up a character on the side that made the claim.
     Served at /stage (also /static/stage.html). Display only: it never speaks, the main dashboard (/?audio=1) does.
     URL params: ?theme=light · ?ws=ws://host:8000/ws · ?all=1 also shows "unverifiable" checks -->
<link rel="stylesheet" href="/static/stage.css">
</head>
<body>
<header>
  <p class="eyebrow">Debate Referee <span id="conn" class="dot" title="websocket"></span>
    <span id="research-chip"></span> <a href="/">dashboard</a>
    <button type="button" id="open-setup" class="link">New debate</button></p>
  <h1 id="motion">Waiting for a motion</h1>
  <p id="brief" class="brief" hidden title="Click to expand"></p>
</header>

<main>
  <section id="prop" class="half prop">
    <div class="head">
      <p class="side-name">Proposition</p>
      <h2 class="speakers">—</h2>
      <div class="tally"></div>
    </div>
    <p class="caption"></p>
    <div class="stage" aria-live="polite"></div>
    <div class="history"></div>
  </section>
  <div class="divider"><span>VS</span></div>
  <section id="opp" class="half opp">
    <div class="head">
      <p class="side-name">Opposition</p>
      <h2 class="speakers">—</h2>
      <div class="tally"></div>
    </div>
    <p class="caption"></p>
    <div class="stage" aria-live="polite"></div>
    <div class="history"></div>
  </section>
</main>

<footer id="cast"></footer>

<div id="setup" class="setup" hidden>
  <form id="setup-form" autocomplete="off">
    <h2>Set up the debate</h2>
    <p class="hint">Pick or type a motion and add a brief. Researching first builds the evidence index and a sheet of
      key facts the referee checks claims against.</p>
    <label class="field">Motion
      <input id="s-motion" placeholder="This house would…" required>
    </label>
    <div id="s-picks" class="picks"></div>
    <label class="field">Brief <small>optional: context, scope, key terms, what each side is likely to argue</small>
      <textarea id="s-brief" rows="5" placeholder="e.g. UK focus. Proposition will lean on air-quality deaths and the Ghent and Oslo schemes; opposition on high-street footfall, disabled access and rural commuters."></textarea>
    </label>
    <div class="names">
      <label class="field prop">Proposition <small>channel A</small><input id="s-prop" value="Proposition"></label>
      <label class="field opp">Opposition <small>channel B</small><input id="s-opp" value="Opposition"></label>
    </div>
    <div id="s-research" class="research-box" hidden>
      <p id="s-status"></p>
      <div class="bar"><div id="s-bar"></div></div>
    </div>
    <div class="row">
      <button type="button" id="s-go-research">Research this debate</button>
      <button type="submit" id="s-start" class="primary">Start debate</button>
      <button type="button" id="s-close">Close</button>
    </div>
  </form>
</div>
<script src="/static/stage-cast.js"></script>
<script src="/static/stage.js"></script>
</body>
</html>
